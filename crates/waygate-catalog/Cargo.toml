[package]
name = "waygate-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
waygate-telemetry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
# The grant sweeper needs `tokio::time::interval` and `tokio::select!`
# in non-test code, so promote tokio out of dev-dependencies.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
waygate-test-support.workspace = true
