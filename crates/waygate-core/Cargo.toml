[package]
name = "waygate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
time.workspace = true
utoipa.workspace = true
uuid.workspace = true
# Only for the `http` feature (the shared outbound-client factory).
# Optional so the many dependency-light consumers don't pull reqwest.
reqwest = { workspace = true, optional = true }
# Optional alongside reqwest: only the capped-body reader streams a response.
futures = { workspace = true, optional = true }
# Only for the `store` feature (the ready-made StoreError + sqlx mapping).
sqlx = { workspace = true, optional = true }

[features]
http = ["dep:reqwest", "dep:futures"]
store = ["dep:sqlx"]

[dev-dependencies]
# Self dev-dependency: builds this crate's OWN tests with the optional
# features on, so the feature-gated http_client and StoreError tests run
# under a plain `cargo test --workspace` / `cargo nextest run --workspace`
# with no extra --features invocation. Dev-only — consumers still get the
# dependency-light default feature set.
waygate-core = { path = ".", features = ["http", "store"] }
# Response construction for the capped-body reader's tests: `reqwest::Response`
# is built from an `http::Response`, so the cap is exercised without a server
# and without adding a runtime or web framework to this deliberately
# dependency-light leaf crate.
http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
