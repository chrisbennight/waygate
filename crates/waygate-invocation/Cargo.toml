[package]
name = "waygate-invocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
waygate-core.workspace = true
waygate-oidc.workspace = true

async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

# rmcp comes in for the response shape (`CallToolResult` / `Content` /
# `ErrorData`). The trait is otherwise transport-neutral; we lean on rmcp's
# types instead of redefining them so the GatewayServer adapter stays a
# byte-level pass-through. A transport-neutral response type can be
# extracted later, once a second consumer materializes.
rmcp = { workspace = true, features = ["server"] }
