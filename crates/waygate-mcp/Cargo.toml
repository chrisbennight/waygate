[package]
name = "waygate-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
waygate-catalog.workspace = true
waygate-core.workspace = true
waygate-evidence.workspace = true
waygate-invocation.workspace = true
waygate-llm-credentials.workspace = true
waygate-llm-dispatch.workspace = true
waygate-llm-translate.workspace = true
waygate-oidc.workspace = true
waygate-quota.workspace = true
waygate-skills.workspace = true
waygate-telemetry.workspace = true
base64.workspace = true
futures.workspace = true
http.workspace = true
# JSON-schema validator for the InvocationService
# `validate_output` stage. `default-features = false` matches
# the workspace pin.
jsonschema = { workspace = true }
# Response-inspector regexes (default PII ruleset).
# RE2-derivative — worst-case O(n) match, no catastrophic
# backtracking.
regex = { workspace = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
time.workspace = true
url.workspace = true
anyhow.workspace = true
blake3.workspace = true
tokio.workspace = true

rmcp = { workspace = true, features = [
    "server",
    "macros",
    "schemars",
    "server-side-http",
    "transport-streamable-http-server",
    # URL-mode elicitation — Peer<RoleServer>::create_elicitation, used to
    # send the present operator straight to a queued change's approval page.
    "elicitation",
] }
tantivy.workspace = true

[dev-dependencies]
waygate-test-support.workspace = true
axum = { workspace = true }
waygate-llm-providers.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-util.workspace = true
tower.workspace = true
reqwest = { workspace = true }
sha2.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }

[[bench]]
name = "validator_cache"
harness = false

[[example]]
name = "retrieval_strategy_evaluation"
test = true
