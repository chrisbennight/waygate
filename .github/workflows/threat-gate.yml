name: Container update threat gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  threat-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for runtime image updates
        id: relevance
        run: python3 scripts/threat-gate/scanner.py --check-only
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - if: steps.scope.outputs.scanner_tests == 'true'
        name: Verify scanner contracts
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gateway-threat-tests"
          "$RUNNER_TEMP/gateway-threat-tests/bin/pip" install --require-hashes --only-binary=:all: -r scripts/threat-gate/requirements.txt
          "$RUNNER_TEMP/gateway-threat-tests/bin/python" -m pytest scripts/threat-gate/tests -q
      - if: steps.relevance.outputs.scan-required == 'true'
        name: Install Grype
        env:
          GRYPE_VERSION: "0.110.0"
          GRYPE_CHECKSUM: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
        run: bash scripts/threat-gate/install-grype.sh
      - if: steps.relevance.outputs.scan-required == 'true'
        name: Evaluate image changes
        run: python3 -u scripts/threat-gate/scanner.py
