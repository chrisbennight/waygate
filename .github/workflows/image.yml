name: image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  PG_IMAGE: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    outputs:
      image: ${{ steps.scope.outputs.image }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Avoid generating and caching incremental state for disposable CI builds.
      CARGO_INCREMENTAL: '0'
      # Keep the workspace's test binaries within hosted-runner storage limits.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      AUDIT_DATABASE_URL: postgres://gateway:test@127.0.0.1:5432/gateway
      GATEWAY_AS_DATABASE_URL: postgres://gateway:test@127.0.0.1:5432/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Check for committed credentials
        run: bash scripts/check-secrets.sh
      - if: steps.scope.outputs.guards == 'true'
        name: Run repository source guards
        run: |
          set -euo pipefail
          bash scripts/check-migrations.sh
          bash scripts/check-migrations-immutable.sh --self-test
          bash scripts/check-migrations-immutable.sh
          bash scripts/check-policy-annotations.sh
          bash scripts/check-synthetic-policy-fixtures.sh
          bash scripts/check-no-local-escapers.sh
          bash scripts/check-single-aead.sh
          bash scripts/check-single-ip-policy.sh
          bash scripts/check-no-local-ts-formatters.sh
          bash scripts/check-shared-pagination-limits.sh
          bash scripts/check-shared-http-client.sh
          bash scripts/check-architecture-doc.sh
          bash scripts/check-invocation-stages-doc.sh
          bash scripts/check-dependency-direction.sh
          bash scripts/check-doc-anchors.sh
          bash scripts/check-shared-store-error.sh
          bash scripts/check-capability-guards.sh
          bash scripts/check-page-chrome.sh
          bash scripts/check-admin-boilerplate.sh
          bash scripts/check-env-parsing.sh
          bash scripts/check-unused-deps.sh
          bash scripts/check-no-plan-citations.sh
          bash scripts/check-licenses.sh
      - if: steps.scope.outputs.rust_scope != 'none' || steps.scope.outputs.licenses == 'true' || steps.scope.outputs.architecture == 'true' || steps.scope.outputs.tool_context == 'true' || steps.scope.outputs.admin_assets == 'true'
        name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - name: Verify the browser bundle
        if: steps.scope.outputs.browser == 'true'
        run: |
          set -euo pipefail
          npm ci --prefix crates/waygate-admin/codemirror
          bash crates/waygate-admin/codemirror/build.sh --check

      - name: Check documentation
        if: steps.scope.outputs.docs == 'true' && steps.scope.outputs.guards != 'true'
        run: |
          set -euo pipefail
          bash scripts/check-doc-anchors.sh
          bash scripts/check-licenses.sh
          bash scripts/check-no-plan-citations.sh

      - name: Check architecture documentation against its native contract
        if: steps.scope.outputs.architecture == 'true' && steps.scope.outputs.guards != 'true'
        run: |
          set -euo pipefail
          bash scripts/check-architecture-doc.sh
          bash scripts/check-invocation-stages-doc.sh
          bash scripts/check-dependency-direction.sh
          cargo test --locked -p waygate-mcp --lib architecture_stage_table_matches_code_order_and_status

      - name: Test repository scripts
        if: steps.scope.outputs.tooling == 'true'
        run: |
          set -euo pipefail
          node --test scripts/report-tool-context.test.mjs scripts/dashboard-badge.test.mjs
          python3 -m unittest discover -s scripts -p 'test_release_*.py'

      - name: Check synthetic identities in the tool capture
        if: steps.scope.outputs.synthetic_fixtures == 'true' && steps.scope.outputs.guards != 'true'
        run: bash scripts/check-synthetic-policy-fixtures.sh

      - name: Check shipped dashboard assets
        if: steps.scope.outputs.admin_assets == 'true' && steps.scope.outputs.rust_scope != 'workspace'
        run: |
          set -euo pipefail
          cargo test --locked -p waygate-admin --test suite style_tokens::
          cargo test --locked -p waygate-admin --test dashboard_render chrome::

      - if: steps.scope.outputs.licenses == 'true'
        name: Verify generated license notices
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
          bash scripts/generate-rust-licenses.sh --check
      - if: steps.scope.outputs.rust_scope != 'none'
        name: Check formatting
        run: cargo fmt --all -- --check

      - if: steps.scope.outputs.rust_scope != 'none'
        name: Install pinned cargo-nextest
        run: bash scripts/ensure-nextest.sh

      - env:
          CARGO_CHECK_SCOPE: ${{ steps.scope.outputs.rust_scope }}
        if: steps.scope.outputs.rust_scope != 'none'
        name: Lint workspace
        run: bash scripts/ci-cargo.sh clippy --all-targets --locked -- -D warnings

      - env:
          CARGO_CHECK_SCOPE: ${{ steps.scope.outputs.rust_scope }}
        if: steps.scope.outputs.rust_scope != 'none'
        name: Compile workspace tests
        # Use the same Cargo graph for compilation and execution below.
        run: bash scripts/ci-cargo.sh nextest run --locked --profile ci --no-run
      - if: steps.scope.outputs.rust_scope == 'workspace' || steps.scope.outputs.tool_context == 'true'
        name: Check tool-definition size limits
        # This example consumes the production budget and registry projection.
        # It reuses compiled workspace dependencies without starting a database.
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p waygate-mcp --example tool_context_projection
          "${CARGO_TARGET_DIR:-target}/debug/examples/tool_context_projection" |
            node scripts/report-tool-context.mjs --budget scripts/fixtures/tool-context/standard-budget.json -

      - if: steps.scope.outputs.rust_scope == 'workspace'
        name: Start test database
        run: |
          set -euo pipefail
          name="gateway-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PG_CONTAINER=$name" >> "$GITHUB_ENV"
          sudo docker run -d --name "$name" -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=gateway \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=gateway \
            "$PG_IMAGE" -c max_connections=200 >/dev/null
          for _ in $(seq 1 60); do
            if sudo docker exec "$name" pg_isready -h 127.0.0.1 -U gateway -d gateway >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          sudo docker logs "$name" >&2
          exit 1

      - env:
          CARGO_CHECK_SCOPE: ${{ steps.scope.outputs.rust_scope }}
        if: steps.scope.outputs.rust_scope != 'none'
        name: Test workspace
        run: bash scripts/ci-cargo.sh nextest run --locked --profile ci
      - env:
          CARGO_CHECK_SCOPE: ${{ steps.scope.outputs.rust_scope }}
        if: steps.scope.outputs.rust_scope == 'workspace'
        name: Test workspace documentation
        run: bash scripts/ci-cargo.sh test --doc --locked

      - env:
          CARGO_CHECK_SCOPE: ${{ steps.scope.outputs.rust_scope }}
        if: steps.scope.outputs.rust_scope != 'none'
        name: Check workspace
        run: bash scripts/ci-cargo.sh check --locked

      - name: Stop test database
        if: steps.scope.outputs.rust_scope == 'workspace' && (always())
        run: sudo docker rm -f -v "${PG_CONTAINER:-}" >/dev/null 2>&1 || true

      - name: Report runner resources
        if: always()
        run: |
          df -h .
          free -h

  verify-image:
    if: github.event_name != 'push' && needs.test.outputs.image == 'true'
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image event and release identity
        run: python3 scripts/release_policy.py

      - name: Resolve GHCR image destination
        run: |
          echo "GATEWAY_IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: ./build-docker.sh

      - name: Smoke image
        run: ./scripts/smoke-gateway-image.sh

  publish-image:
    if: github.event_name == 'push' && needs.test.outputs.image == 'true'
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest
    concurrency:
      group: gateway-image-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image event and release identity
        run: python3 scripts/release_policy.py

      - name: Resolve GHCR image destination
        run: |
          echo "GATEWAY_IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: ./build-docker.sh

      - name: Smoke image
        run: ./scripts/smoke-gateway-image.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-gateway-image.py
