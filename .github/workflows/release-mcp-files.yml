# Release only explicit tags on merged commits; build jobs have no publication credential.
name: Build and release mcp-files
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to verify for a build-only run
        type: string
        required: false
  push:
    tags:
      - 'mcp-files-v*'
permissions:
  contents: read
concurrency:
  group: release-mcp-files-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_ZIGBUILD_VERSION: 0.23.0
  ZIGLANG_VERSION: 0.16.0
jobs:
  linux-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/helper_release.py
      - name: Install Rust
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-pc-windows-gnu
      - name: Install cargo-zigbuild
        run: |
          set -euo pipefail
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/pip install --quiet \
            "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" \
            "ziglang==${ZIGLANG_VERSION}"
      - name: Build
        run: |
          set -euo pipefail
          export PATH="/tmp/zigvenv/bin:$PATH"
          cargo-zigbuild zigbuild -p waygate-files-helper --release --locked \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl \
            --target x86_64-pc-windows-gnu
      - name: Verify the native artifact runs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/mcp-files
          file "$bin" | grep -q 'statically linked'
          "$bin" --version
          bash scripts/verify-mcp-files-version.sh "$bin"
          "$bin" thumbprint --config-dir "$(mktemp -d)" | grep -Eq '^[A-Za-z0-9_-]{43}$'
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/mcp-files dist/mcp-files-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/mcp-files dist/mcp-files-linux-arm64
          cp target/x86_64-pc-windows-gnu/release/mcp-files.exe dist/mcp-files-windows-amd64.exe
          cp LICENSE-APACHE THIRD_PARTY_LICENSES.md dist/
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - name: Retain verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-files-linux-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
    outputs:
      version: ${{ steps.release.outputs.version }}
  macos:
    needs: linux-windows
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/helper_release.py
      - name: Ensure a Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo build -p waygate-files-helper --release --locked \
            --target aarch64-apple-darwin
      - name: Verify the artifact runs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bin=target/aarch64-apple-darwin/release/mcp-files
          "$bin" --version
          bash scripts/verify-mcp-files-version.sh "$bin"
          "$bin" thumbprint --config-dir "$(mktemp -d)" | grep -Eq '^[A-Za-z0-9_-]{43}$'
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/mcp-files dist/mcp-files-macos-arm64
          cd dist
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l
      - name: Retain verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-files-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-files-v')
    needs:
      - linux-windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate release identity
        run: python3 scripts/helper_release.py
      - name: Collect verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: mcp-files-*
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Verify checksums
        run: |-
          cd dist
          sha256sum --check --strict *.sha256
      - name: Publish helper release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.linux-windows.outputs.version }}
        run: |-
          set -euo pipefail
          release_flags=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then release_flags+=(--prerelease); fi
          printf 'mcp-files %s, built from source commit %s.\n\nAssets include SHA-256 checksums and project/dependency licenses.\n' "$VERSION" "$RELEASE_SHA" > release-notes.txt
          gh release create "mcp-files-v${VERSION}" dist/* --verify-tag --title "mcp-files ${VERSION}" --notes-file release-notes.txt "${release_flags[@]}"
